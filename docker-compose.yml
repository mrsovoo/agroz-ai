version: "3.8"

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agroz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agroz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Express Backend API (api.agroz.uz)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: agroz-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/agroz
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3001,https://agroz.uz,https://admin.agroz.uz"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_AUTH_BOT_TOKEN: ${TELEGRAM_AUTH_BOT_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "4000:4000"

  # 3. Next.js Frontend — Mijozlar va Telegram Mini App (agroz.uz)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: agroz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "3000:3000"

  # 4. Next.js Admin Panel — Super Admin Boshqaruv Markazi (admin.agroz.uz)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: agroz-admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "3001:3001"

volumes:
  pgdata:
