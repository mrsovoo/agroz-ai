services:
  postgres:
    image: postgres:16-alpine
    container_name: agroz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agroz_user
      POSTGRES_PASSWORD: agroz_secret_password
      POSTGRES_DB: agroz_b2b_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroz_user -d agroz_b2b_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agroz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
