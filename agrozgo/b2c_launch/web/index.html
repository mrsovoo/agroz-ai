<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="AgrozGO — B2C Agro Marketplace Mobile App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AgrozGO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AgrozGO — Agro Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (typeof window.Telegram.WebApp.enableClosingConfirmation === 'function') {
          window.Telegram.WebApp.enableClosingConfirmation();
        }
      }
    } catch (e) {
      console.warn("Telegram WebApp init:", e);
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #F8FAF7;
      touch-action: pan-x pan-y;
      -webkit-user-select: none;
      user-select: none;
    }
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F8FAF7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 99999;
      transition: opacity 0.3s ease;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(53, 202, 86, 0.2);
      border-top-color: #35CA56;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #1B211D;
      letter-spacing: -0.2px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="flutter-loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">AgrozGO yuklanmoqda...</div>
  </div>
  <script>
    function removeLoader() {
      const loader = document.getElementById('flutter-loading');
      if (loader && !loader.dataset.hiding) {
        loader.dataset.hiding = 'true';
        loader.style.pointerEvents = 'none';
        loader.style.opacity = '0';
        setTimeout(() => {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 320);
      }
    }

    // 1. Listen for Flutter first render frame
    window.addEventListener('flutter-first-frame', removeLoader);

    // 2. Watch for Flutter canvas or view DOM injection
    const observer = new MutationObserver((mutations) => {
      for (const m of mutations) {
        for (const node of m.addedNodes) {
          if (node.nodeType === 1) {
            const tag = (node.tagName || '').toLowerCase();
            if (tag.startsWith('flt-') || tag === 'flutter-view') {
              setTimeout(removeLoader, 150);
              observer.disconnect();
              return;
            }
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Absolute safety timeout (3.5s fallback)
    setTimeout(removeLoader, 3500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
