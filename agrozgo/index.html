    <title>AgrozGO — Yagona Agro-Marketplace</title>
    <!-- Telegram Mini App Detection & Seamless Launch -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        function checkAndRedirect() {
          try {
            var hash = window.location.hash || '';
            var search = window.location.search || '';
            var ua = navigator.userAgent || '';
            var tg = window.Telegram && window.Telegram.WebApp;
            var isTelegram = Boolean(
              window.TelegramWebviewProxy ||
              /Telegram/i.test(ua) ||
              hash.indexOf('tgWeb') !== -1 ||
              search.indexOf('tgWeb') !== -1 ||
              (tg && (tg.initData || (tg.platform && tg.platform !== 'unknown')))
            );
            if (isTelegram && !window.location.pathname.startsWith('/app')) {
              document.documentElement.style.display = 'none';
              window.location.replace('/app/' + search + hash);
              return true;
            }
          } catch (e) {}
          return false;
        }
        checkAndRedirect();
        window.addEventListener('DOMContentLoaded', checkAndRedirect);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
